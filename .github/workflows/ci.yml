name: CI (PR Checks)

on:
  pull_request:
    branches: [ "main" ]

# Concurrency: Cancels redundant in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-check:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Java JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false

      - name: Create Dummy Google Services Config (if missing)
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'JSON' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "famwake-ci-dummy",
              "storage_bucket": "famwake-ci-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "de.familienwecker.famwake"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForCiCompileChecksOnly0000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --build-cache --parallel

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --build-cache --parallel

  ios-check:
    name: iOS Build & Unit Tests
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Create Dummy Secrets Configuration
        run: |
          mkdir -p ios/FamWake/Config
          cat << 'SECRETS' > ios/FamWake/Config/Secrets.xcconfig
          REVENUECAT_IOS_API_KEY =
          APTABASE_APP_KEY =
          APTABASE_HOST =
          SECRETS
          if [ ! -f ios/FamWake/GoogleService-Info.plist ]; then
            cat << 'PLIST' > ios/FamWake/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSyDummyKeyForCiCompileChecksOnly0000</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>de.familienwecker.famwake</string>
            <key>PROJECT_ID</key>
            <string>famwake-ci-dummy</string>
            <key>STORAGE_BUCKET</key>
            <string>famwake-ci-dummy.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000000000</string>
          </dict>
          </plist>
          PLIST
          fi

      - name: Run iOS Unit Tests
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -E "iPhone (16|17)" | head -n 1 | sed -E 's/^[[:space:]]*//' | sed -E 's/ \([A-F0-9-]+\).*//')
          xcodebuild test -project ios/FamWake.xcodeproj \
            -scheme FamWake \
            -destination "platform=iOS Simulator,name=${SIM_NAME:-iPhone 16}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS App for Simulator (Pure Compile Check)
        run: |
          xcodebuild -project ios/FamWake.xcodeproj \
            -scheme FamWake \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

  functions-check:
    name: Cloud Functions Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm --prefix functions ci

      - name: Run Functions Unit Tests
        run: npm --prefix functions test

