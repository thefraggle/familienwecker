name: Android – Upload Store Listings

on:
  workflow_dispatch:

jobs:
  upload-listings:
    name: Generate & Upload Listings
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Generate metadata
        run: python3 scripts/generate_android_metadata.py

      - name: Upload listings via Fastlane supply
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          cd android
          fastlane supply \
            --json_key_data "$SUPPLY_JSON_KEY_DATA" \
            --package_name de.familienwecker.famwake \
            --metadata_path fastlane/metadata/android \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true
