name: Android Release Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    # Gibt dem Workflow die Schreibrechte für GitHub Releases
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Create Google Services Config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cat << 'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      # Berechne Metadaten für den Build (kompatibel mit Configuration Cache)
      - name: Prepare Build Metadata
        id: metadata
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=format:%d.%m.%Y\ %H:%M)" >> $GITHUB_OUTPUT

      # Baut das un-signierte Release APK und das Release AAB
      - name: Build Release APK and AAB
        run: |
          ./gradlew assembleRelease bundleRelease \
            --build-cache --parallel --configuration-cache \
            -PcommitHash=${{ steps.metadata.outputs.hash }} \
            -PcommitDate="${{ steps.metadata.outputs.date }}" \
            -Dorg.gradle.jvmargs="-Xmx4g"

      # Entschlüsselt den Keystore aus den GitHub Secrets
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: python3 -c "import os, base64; open('app/keystore.jks', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64']))"

      # Sucht die aktuellsten Android Build Tools auf dem Runner und fügt sie zum PATH hinzu
      - name: Setup Android Build Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Verwende Build Tools aus: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      # Führt Zipalign und die Signierung manuell ohne fehleranfällige Drittanbieter-Actions aus
      - name: Sign APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # 1. APK finden und signieren
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          zipalign -v 4 "$APK_PATH" aligned.apk
          apksigner sign --ks app/keystore.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out FamWake-${{ github.ref_name }}-release.apk aligned.apk
            
          # 2. AAB finden und signieren (App Bundles benötigen Jarsigner)
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -keystore app/keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_PATH" "$KEY_ALIAS"
          cp "$AAB_PATH" FamWake-${{ github.ref_name }}-release.aab

      # Nimmt das fertige APK und AAB und hängt sie als Pre-Release an den GitHub-Tag
      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FamWake-${{ github.ref_name }}-release.apk
            FamWake-${{ github.ref_name }}-release.aab
          name: Release ${{ github.ref_name }}
          body: "[CHANGELOG.en.md](https://github.com/thefraggle/familienwecker/blob/main/docs/CHANGELOG.en.md)"
          prerelease: true
