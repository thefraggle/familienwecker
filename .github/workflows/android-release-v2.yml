name: Android Release Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'AAB bauen (für Play Store)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Upload
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Create Google Services Config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cat << 'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Prepare Build Metadata
        id: metadata
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=format:%d.%m.%Y\ %H:%M)" >> $GITHUB_OUTPUT
          # Extract base version from build.gradle.kts (e.g. 1.5.2)
          GRADLE_VERSION=$(grep "val appVersion" app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | sed 's/-DEV//')
          
          # Version naming logic: Tag has priority
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            APP_VERSION="${TAG_NAME#v}"
          else
            APP_VERSION="$GRADLE_VERSION"
          fi
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

          # AAB nur wenn manuell angefordert
          if [[ "${{ github.event.inputs.build_aab }}" == "true" ]]; then
            echo "build_aab=true" >> $GITHUB_OUTPUT
            echo "build_apk=false" >> $GITHUB_OUTPUT
          else
            echo "build_aab=false" >> $GITHUB_OUTPUT
            echo "build_apk=true" >> $GITHUB_OUTPUT
          fi

          # Release-Typ: x.x.0 → latest, alles andere → pre-release
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      # APK für alle Tag-Pushes (und manuell wenn kein AAB angefordert)
      - name: Build APK
        if: steps.metadata.outputs.build_apk == 'true'
        run: |
          ./gradlew assembleRelease \
            --build-cache --parallel --configuration-cache \
            -PversionName=${{ steps.metadata.outputs.app_version }} \
            -PcommitHash=${{ steps.metadata.outputs.hash }} \
            -PcommitDate="${{ steps.metadata.outputs.date }}" \
            -Dorg.gradle.jvmargs="-Xmx4g"

      # AAB nur bei manueller Anforderung
      - name: Build AAB (Store Release)
        if: steps.metadata.outputs.build_aab == 'true'
        run: |
          ./gradlew bundleRelease \
            --build-cache --parallel --configuration-cache \
            -PversionName=${{ steps.metadata.outputs.app_version }} \
            -PcommitHash=${{ steps.metadata.outputs.hash }} \
            -PcommitDate="${{ steps.metadata.outputs.date }}" \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: python3 -c "import os, base64; open('app/keystore.jks', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64']))"

      - name: Setup Android Build Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: Sign APK
        if: steps.metadata.outputs.build_apk == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          zipalign -v 4 "$APK_PATH" aligned.apk
          apksigner sign --ks app/keystore.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out FamWake-${{ github.ref_name }}-release.apk aligned.apk

      - name: Sign AAB
        if: steps.metadata.outputs.build_aab == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -keystore app/keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_PATH" "$KEY_ALIAS"
          cp "$AAB_PATH" FamWake-v${{ steps.metadata.outputs.app_version }}-release.aab

      # GitHub Release mit APK – x.x.0 = latest, x.x.1+ = pre-release
      - name: Create GitHub Release (APK)
        if: steps.metadata.outputs.build_apk == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FamWake-${{ github.ref_name }}-release.apk
          name: Release ${{ github.ref_name }}
          body: "[CHANGELOG.en.md](https://github.com/thefraggle/familienwecker/blob/main/docs/CHANGELOG.en.md)"
          prerelease: ${{ steps.metadata.outputs.is_prerelease }}

      # AAB als Artefakt für manuellen Download (kein GitHub Release)
      - name: Upload AAB as Artifact (manual run)
        if: steps.metadata.outputs.build_aab == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FamWake-v${{ steps.metadata.outputs.app_version }}-release
          path: FamWake-v${{ steps.metadata.outputs.app_version }}-release.aab
          retention-days: 14
