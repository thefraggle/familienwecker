name: Android Release Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Upload
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Create Google Services Config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cat << 'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Prepare Build Metadata
        id: metadata
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=format:%d.%m.%Y\ %H:%M)" >> $GITHUB_OUTPUT
          # Extract base version from build.gradle.kts
          GRADLE_VERSION=$(grep "val appVersion" app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | sed 's/-DEV//')
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            APP_VERSION="${TAG_NAME#v}"
          else
            APP_VERSION="$GRADLE_VERSION"
          fi
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

          # Immer AAB für Play Store
          echo "build_aab=true" >> $GITHUB_OUTPUT

      - name: Build AAB (Store Release)
        env:
          REVENUECAT_PUBLIC_API_KEY: ${{ secrets.REVENUECAT_PUBLIC_API_KEY }}
        run: |
          ./gradlew bundleRelease \
            --build-cache --parallel --configuration-cache \
            -PversionName=${{ steps.metadata.outputs.app_version }} \
            -PcommitHash=${{ steps.metadata.outputs.hash }} \
            -PcommitDate="${{ steps.metadata.outputs.date }}" \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: python3 -c "import os, base64; open('app/keystore.jks', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64']))"

      - name: Setup Android Build Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -keystore app/keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_PATH" "$KEY_ALIAS"
          cp "$AAB_PATH" FamWake-v${{ steps.metadata.outputs.app_version }}-release.aab

      # GitHub Release nur mit AAB
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FamWake-v${{ steps.metadata.outputs.app_version }}-release.aab
          name: Release ${{ github.ref_name }}
          body: "[CHANGELOG.en.md](https://github.com/thefraggle/familienwecker/blob/main/docs/CHANGELOG.en.md)"
          prerelease: false
          make_latest: true

      # Automatische Veröffentlichung in der Play Console
      - name: Upload to Google Play
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: de.familienwecker.famwake
          releaseFiles: FamWake-v${{ steps.metadata.outputs.app_version }}-release.aab
          track: alpha
          status: completed
          whatsNewDirectory: android/fastlane/metadata/android
