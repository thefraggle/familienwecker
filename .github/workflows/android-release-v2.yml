name: Android Release Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Upload
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Opt into Node.js 24 for all Actions now – GitHub forces this from June 2026
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Gradle-Caching übernimmt gradle/actions/setup-gradle vollständiger

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Export ANDROID_HOME to env context
        # $ANDROID_HOME is a system env var – not available as ${{ env.ANDROID_HOME }}
        # without this step, the NDK cache path resolves to /ndk/... (empty prefix)
        run: echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Cache NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          key: ndk-27.0.12077973

      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Create Google Services Config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Secret bleibt in der Env-Variable – nicht im Script-Text eingebettet
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Prepare Build Metadata
        id: metadata
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=format:%d.%m.%Y\ %H:%M)" >> $GITHUB_OUTPUT
          # Extract base version from build.gradle.kts
          GRADLE_VERSION=$(grep "val appVersion" app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | sed 's/-DEV//')
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            APP_VERSION="${TAG_NAME#v}"
          else
            APP_VERSION="$GRADLE_VERSION"
          fi
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT



      - name: Run Unit Tests
        run: ./gradlew :shared:testDebugUnitTest --build-cache

      - name: Build AAB (Store Release)
        env:
          REVENUECAT_PUBLIC_API_KEY: ${{ secrets.REVENUECAT_PUBLIC_API_KEY }}
        run: |
          ./gradlew bundleRelease \
            --build-cache --parallel --configuration-cache \
            -PversionName=${{ steps.metadata.outputs.app_version }} \
            -PcommitHash=${{ steps.metadata.outputs.hash }} \
            -PcommitDate="${{ steps.metadata.outputs.date }}" \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Keystore in RUNNER_TEMP – isoliert vom Repo-Verzeichnis
          python3 -c "import os, base64; open(os.environ['RUNNER_TEMP'] + '/keystore.jks', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64']))"

      - name: Setup Android Build Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -keystore "$RUNNER_TEMP/keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_PATH" "$KEY_ALIAS"
          cp "$AAB_PATH" FamWake-v${{ steps.metadata.outputs.app_version }}-release.aab

      - name: Generate Play Store Metadata
        run: |
          pip3 install deep-translator==1.11.4
          python3 scripts/generate_metadata.py
          echo "Generated Metadata Structure:"
          ls -R release-notes
          echo "--- Verifying release notes (DE + EN always present) ---"
          cat release-notes/whatsnew-de-DE || echo "No DE file"
          cat release-notes/whatsnew-en-US || echo "No EN file"
          echo "--- Other supported languages (Play Store ignores unknown locales) ---"
          cat release-notes/whatsnew-fr-FR || echo "No FR file"
          cat release-notes/whatsnew-es-ES || echo "No ES file"
          cat release-notes/whatsnew-it-IT || echo "No IT file"
          cat release-notes/whatsnew-pt-PT || echo "No PT file"
          cat release-notes/whatsnew-pl-PL || echo "No PL file"
          cat release-notes/whatsnew-nl-NL || echo "No NL file"
          cat release-notes/whatsnew-sv-SE || echo "No SV file"
          cat release-notes/whatsnew-tr-TR || echo "No TR file"
          cat release-notes/whatsnew-ru-RU || echo "No RU file"
          cat release-notes/whatsnew-uk-UA || echo "No UK file"
          cat release-notes/whatsnew-nb-NO || echo "No NO file"
          cat release-notes/whatsnew-da-DK || echo "No DA file"
          cat release-notes/whatsnew-ja-JP || echo "No JA file"


      # GitHub Release nur mit AAB
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FamWake-v${{ steps.metadata.outputs.app_version }}-release.aab
          name: Release ${{ github.ref_name }}
          body: "[CHANGELOG.en.md](https://github.com/thefraggle/familienwecker/blob/main/docs/CHANGELOG.en.md)"
          prerelease: false
          make_latest: true

      # Automatische Veröffentlichung im Closed Testing Track "FamWake" der Play Console
      - name: Upload to Google Play (Closed Testing)
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@7f5b759879c088a86faf85d18779f7f14e79a086 # v1 – SHA gepinnt um stille Breaking Changes zu verhindern
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: de.familienwecker.famwake
          releaseFiles: FamWake-v${{ steps.metadata.outputs.app_version }}-release.aab
          tracks: FamWake
          status: completed
          whatsNewDirectory: ${{ github.workspace }}/release-notes
