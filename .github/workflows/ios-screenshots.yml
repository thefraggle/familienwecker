name: iOS – Upload Screenshots

# Manual trigger: run to upload generated store screenshots to App Store Connect.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-screenshots:
    name: Upload Screenshots
    runs-on: macos-26
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: latest
          working-directory: ios

      - name: Install dependencies
        run: |
          cd ios
          bundle update fastlane

      - name: Capture Raw Screenshots (Fastlane Snapshot)
        run: |
          cd ios
          bundle exec fastlane snapshot

      - name: Generate Framed App Store Screenshots
        run: |
          pip3 install --break-system-packages deep-translator==1.11.4 pillow==10.3.0
          python3 scripts/generate_screenshots_ios.py

      - name: Upload Screenshots to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          cd ios
          bundle exec fastlane upload_screenshots --verbose

      - name: Commit and Push Screenshots back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/fastlane/screenshots/
          git commit -m "chore(aso): commit generated app store screenshots for all languages" || exit 0
          git push origin main

