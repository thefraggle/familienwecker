name: Alte Releases bereinigen (Manuell)
on:
  workflow_dispatch: # Nur manuelles Starten im GitHub Actions Tab

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (für gh CLI)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Behalte nur die neuesten 10 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Alle Releases nach Datum sortiert holen, ab dem 11. löschen
          gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +11 | while read -r tag; do
            echo "Lösche Release + Tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag || gh release delete "$tag" --yes || true
          done
