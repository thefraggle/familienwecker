name: Generate Android Baseline Profile

on:
  workflow_dispatch:
  schedule:
    # Wöchentlich montags um 03:00 UTC prüfen/generieren
    - cron: "0 3 * * 1"

jobs:
  generate-baseline-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare dummy google-services.json if absent
        if: env.GOOGLE_SERVICES_JSON == ''
        run: |
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"000000000000","project_id":"dummy-project","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"de.familienwecker.famwake"}},"api_key":[{"current_key":"dummy-key"}]}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Generate Release Baseline Profile
        run: |
          ./gradlew :app:generateReleaseBaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect" \
            --no-daemon

      - name: Upload generated Baseline Profile artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/**/generated/baselineProfiles/baseline-prof.txt
          if-no-files-found: warn
