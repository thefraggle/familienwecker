name: Android Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    # Gibt dem Workflow die Schreibrechte für GitHub Releases
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Deine benötigte Java-Version für Android/Gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Google Services Config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cat << 'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      # Baut das un-signierte Release APK und das Release AAB
      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      # Signiert das APK mit deinen GitHub Secrets
      - name: Sign APK
        uses: ilharp/sign-android-release@v1
        id: sign_apk
        with:
          releaseDir: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Signiert das AAB Bundle
      - name: Sign AAB
        uses: ilharp/sign-android-release@v1
        id: sign_aab
        with:
          releaseDir: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Benennt die signierten Dateien um
      - name: Rename Files
        run: |
          mv ${{steps.sign_apk.outputs.signedReleaseFile}} FamWake-${{ github.ref_name }}-release.apk
          mv ${{steps.sign_aab.outputs.signedReleaseFile}} FamWake-${{ github.ref_name }}-release.aab

      # Nimmt das fertige APK und AAB und hängt sie als Pre-Release an den GitHub-Tag
      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FamWake-${{ github.ref_name }}-release.apk
            FamWake-${{ github.ref_name }}-release.aab
          name: Release ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
