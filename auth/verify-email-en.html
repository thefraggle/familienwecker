<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Email - FamWake</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, #1E4D63 100%);
            color: white;
            padding: 20px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .auth-card .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .auth-card h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .auth-card p {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .status-msg {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            display: none;
        }

        .status-msg.error {
            background: rgba(231, 76, 60, 0.2);
            color: #ffb8b1;
            border: 1px solid #e74c3c;
            display: block;
        }

        .status-msg.success {
            background: rgba(46, 204, 113, 0.2);
            color: #a8f0c3;
            border: 1px solid #2ecc71;
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="icon" id="icon">⏳</div>
        <h1>Confirming your email…</h1>
        <p id="subtitle">Please wait a moment.</p>

        <div class="loading-spinner" id="spinner"></div>
        <div id="status" class="status-msg"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_NmOW3QSnWq2pleFKxGbZKHb3kVFxa8A",
            authDomain: "familienwecker.firebaseapp.com",
            projectId: "familienwecker",
            storageBucket: "familienwecker.firebasestorage.app",
            messagingSenderId: "979926159025"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
    </script>

    <script>
        const statusDiv = document.getElementById('status');
        const spinner = document.getElementById('spinner');
        const icon = document.getElementById('icon');
        const subtitle = document.getElementById('subtitle');

        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');
        const mode = urlParams.get('mode');

        async function verifyEmail() {
            if (!oobCode || mode !== 'verifyEmail') {
                spinner.style.display = 'none';
                icon.textContent = '❌';
                statusDiv.textContent = 'Invalid or missing confirmation link. Please request a new one in the app.';
                statusDiv.className = 'status-msg error';
                return;
            }

            try {
                await firebase.auth().applyActionCode(oobCode);

                spinner.style.display = 'none';
                icon.textContent = '✅';
                document.querySelector('h1').textContent = 'Email confirmed!';
                subtitle.textContent = '';
                statusDiv.textContent = 'Your account is now active. Open the FamWake app and tap "I have confirmed" to sign in.';
                statusDiv.className = 'status-msg success';

            } catch (error) {
                console.error(error);
                spinner.style.display = 'none';
                icon.textContent = '❌';
                document.querySelector('h1').textContent = 'Confirmation failed';
                subtitle.textContent = '';

                let msg = 'An error occurred. The link may have expired.';
                if (error.code === 'auth/invalid-action-code') {
                    msg = 'This confirmation link is invalid or has already been used. Please request a new one in the app.';
                } else if (error.code === 'auth/expired-action-code') {
                    msg = 'This confirmation link has expired. Please request a new one in the app.';
                }
                statusDiv.textContent = msg;
                statusDiv.className = 'status-msg error';
            }
        }

        verifyEmail();
    </script>
</body>

</html>
