<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen - FamWake</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, #1E4D63 100%);
            color: white;
            padding: 20px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .auth-card h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .auth-card p {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent-color);
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 140, 66, 0.4);
        }

        .status-msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .status-msg.error {
            background: rgba(231, 76, 60, 0.2);
            color: #ffb8b1;
            border: 1px solid #e74c3c;
            display: block;
        }

        .status-msg.success {
            background: rgba(46, 204, 113, 0.2);
            color: #a8f0c3;
            border: 1px solid #2ecc71;
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h1>Neues Passwort</h1>
        <p>Gib dein neues Passwort für FamWake ein.</p>

        <form id="reset-form">
            <div class="form-group">
                <label for="password">Neues Passwort</label>
                <input type="password" id="password" required minlength="6" placeholder="******">
            </div>
            <div class="form-group">
                <label for="password-confirm">Passwort bestätigen</label>
                <input type="password" id="password-confirm" required minlength="6" placeholder="******">
            </div>
            <button type="submit" class="auth-btn" id="submit-btn">Passwort speichern</button>
        </form>

        <div id="status" class="status-msg"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    <script>
        // Inline Firebase Configuration (replacing external firebase-config.js for compat SDK)
        const firebaseConfig = {
            apiKey: "AIzaSyB_NmOW3QSnWq2pleFKxGbZKHb3kVFxa8A",
            authDomain: "familienwecker.firebaseapp.com",
            projectId: "familienwecker",
            storageBucket: "familienwecker.firebasestorage.app",
            messagingSenderId: "979926159025"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
    </script>

    <script>
        const form = document.getElementById('reset-form');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submit-btn');

        // Extract oobCode and language from URL
        // language is embedded in the page filename (e.g. reset-password-en.html → 'en')
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');
        const pageLang = document.documentElement.lang || 'de';

        if (!oobCode) {
            statusDiv.textContent = "Ungültiger oder fehlender Reset-Code. Bitte fordere einen neuen Link in der App an.";
            statusDiv.className = "status-msg error";
            form.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('password-confirm').value;

            if (pass !== confirm) {
                statusDiv.textContent = "Die Passwörter stimmen nicht überein.";
                statusDiv.className = "status-msg error";
                return;
            }

            statusDiv.innerHTML = '<span class="loading-spinner"></span>Wird gespeichert...';
            statusDiv.className = "status-msg success";
            submitBtn.disabled = true;

            try {
                // Fetch email first to be able to send confirmation
                const email = await firebase.auth().verifyPasswordResetCode(oobCode);

                await firebase.auth().confirmPasswordReset(oobCode, pass);

                // Trigger branded confirmation email via direct fetch (compat SDK → v2 CORS issue)
                try {
                    await fetch(
                        'https://europe-west3-familienwecker.cloudfunctions.net/sendBrandedConfirmationEmail',
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ data: { email: email, language: pageLang } })
                        }
                    );
                } catch (emailErr) {
                    console.error("Failed to send confirmation email:", emailErr);
                    // We don't block the UI for this, reset was still successful
                }

                statusDiv.textContent = "Dein Passwort wurde erfolgreich geändert. Du kannst dich jetzt in der App anmelden.";
                statusDiv.className = "status-msg success";
                form.style.display = 'none';
            } catch (error) {
                console.error(error);
                let msg = "Ein Fehler ist aufgetreten. Der Link ist möglicherweise abgelaufen.";
                if (error.code === 'auth/weak-password') msg = "Das Passwort ist zu schwach.";
                statusDiv.textContent = msg;
                statusDiv.className = "status-msg error";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
